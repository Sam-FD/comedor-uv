spring.application.name=comedor-uv-backend
server.port=${PORT:8080}

# Conexion a PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/comedor_uv}
spring.datasource.username=${DB_USER:comedor_user}
spring.datasource.password=${DB_PASS:comedor_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City

# Pool HikariCP ajustado para bases serverless (Neon)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=20000

# Modo de datos iniciales (false = solo cuenta personal y menu; true = incluye estudiantes y pedidos demo)
comedor.datos-demo=${DATOS_DEMO:false}
comedor.admin.credencial=${ADMIN_CREDENCIAL:P10001}
comedor.admin.nombre=${ADMIN_NOMBRE:Rosa Ramirez Ortega}
comedor.admin.correo=${ADMIN_CORREO:r.ramirez@uv.mx}
comedor.admin.password=${ADMIN_PASSWORD:uv2026}

# Reglas operativas del comedor
comedor.reglas.umbral-nivel-1=3
comedor.reglas.duracion-nivel-1-meses=1
comedor.reglas.umbral-nivel-2=4
comedor.reglas.extension-nivel-2-dias=15
comedor.reglas.dias-corte-limpio=60
comedor.reglas.minutos-vigencia-recoleccion=15
comedor.reglas.hora-corte-matutino=14:30

# Token JWT para sesiones
comedor.jwt.secret=${JWT_SECRET:ComedorUniversitarioUV2026ClaveSecretaParaFirmarTokensJWTDeFormaSegura}
comedor.jwt.expiracion-ms=43200000

# Servidor Socket.IO
comedor.socket.habilitado=${SOCKET_ENABLED:true}
comedor.socket.host=${SOCKET_HOST:0.0.0.0}
comedor.socket.port=${SOCKET_PORT:9092}

# Origenes permitidos en CORS
comedor.cors.origins=${CORS_ORIGINS:http://localhost,http://localhost:*,http://127.0.0.1,http://127.0.0.1:*,capacitor://localhost,https://localhost,https://*.vercel.app,https://*.onrender.com,http://192.168.*,http://10.*}

# Pasarela de pagos en modo prueba (STRIPE_SECRET_KEY=sk_test_... activa Stripe Sandbox; vacio usa sandbox local)
comedor.pasarela.stripe-secret-key=${STRIPE_SECRET_KEY:}
comedor.pasarela.moneda=mxn
