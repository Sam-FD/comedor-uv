services:
  postgres:
    image: postgres:17-alpine
    container_name: comedor_uv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: comedor_uv
      POSTGRES_USER: comedor_user
      POSTGRES_PASSWORD: comedor_pass
      TZ: America/Mexico_City
    ports:
      - "5432:5432"
    volumes:
      - pgdata_comedor:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comedor_user -d comedor_uv"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_comedor:
