services:
  - type: web
    name: comedor-uv-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/salud
    envVars:
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,https://*.onrender.com,capacitor://localhost,http://localhost,https://localhost"
